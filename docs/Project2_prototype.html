<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeerMindAI – Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pri:#5B4EF0;--pri2:#7C3AED;--priS:#EEEDFE;--bg:#F6F7FB;--card:#fff;--bd:#E4E7EF;--tx:#0F172A;--sub:#64748B;--ok:#059669;--okS:#D1FAE5;--warn:#B45309;--warnS:#FEF3C7;--bad:#DC2626;--badS:#FEE2E2;--blue:#2563EB;--blueS:#DBEAFE;--nav:#0F1226;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
[data-go],[data-act],[data-modal],[data-toast]{cursor:pointer}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:650}
.sub{color:var(--sub)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:600}.c{text-align:center}
.row{display:flex;align-items:center;gap:12px}.rowb{display:flex;align-items:center;justify-content:space-between;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.g21{display:grid;grid-template-columns:2fr 1fr;gap:20px}.g12{display:grid;grid-template-columns:1fr 2fr;gap:20px}
.mt{margin-top:20px}.mb{margin-bottom:20px}.mt1{margin-top:8px}.hide{display:none!important}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:22px}
.card.flat{padding:0;overflow:hidden}
.card h3{margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14px;background:none;transition:.15s;white-space:nowrap}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 4px 14px rgba(91,78,240,.3)}
.btn-pri:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-sec{background:#fff;border-color:#CBD5E1}.btn-sec:hover{background:#F8FAFC}
.btn-ghost{color:var(--pri)}.btn-ghost:hover{background:var(--priS)}
.btn-bad{background:var(--bad);color:#fff}.btn-okb{background:var(--ok);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:8px}.btn-lg{padding:14px 26px;font-size:16px;border-radius:12px}.btn-block{width:100%}
.btn:disabled{opacity:.5;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.b-ok{background:var(--okS);color:#047857}.b-warn{background:var(--warnS);color:var(--warn)}.b-bad{background:var(--badS);color:#B91C1C}.b-blue{background:var(--blueS);color:#1D4ED8}.b-gray{background:#EEF1F6;color:#475569}.b-pri{background:var(--priS);color:var(--pri)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:13px}
.in,.sel,textarea.in{width:100%;padding:11px 14px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;outline:none;transition:.15s}
.in:focus,.sel:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(91,78,240,.15)}
textarea.in{resize:vertical;min-height:90px}
.hint{font-size:12px;color:var(--sub)}
.pg{height:8px;background:#E8EBF3;border-radius:99px;overflow:hidden}.pg>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.pg.ok>i{background:var(--ok)}.pg.warn>i{background:#F59E0B}.pg.bad>i{background:var(--bad)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:#fff;font-size:13px;font-weight:500}
.chip.sel,.chip.on{background:var(--priS);border-color:var(--pri);color:var(--pri)}
.tog{width:44px;height:24px;border-radius:99px;background:#CBD5E1;position:relative;flex:none;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tog.on{background:var(--pri)}.tog.on::after{left:23px}
.tabs{display:flex;gap:6px;background:#EEF1F6;padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto}
.tab{padding:8px 16px;border-radius:9px;font-weight:600;color:var(--sub);white-space:nowrap}.tab.active{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);font-weight:600;padding:12px 18px;background:#F8FAFC;border-bottom:1px solid var(--bd)}
td{padding:14px 18px;border-bottom:1px solid #EEF1F6;vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFE}
.stat{display:flex;flex-direction:column;gap:2px}.stat .n{font-size:28px;font-weight:800;letter-spacing:-.02em}.stat .l{color:var(--sub);font-size:13px}
.ico{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--priS);color:var(--pri);flex:none}
.ico.ok{background:var(--okS);color:var(--ok)}.ico.warn{background:var(--warnS);color:var(--warn)}.ico.blue{background:var(--blueS);color:var(--blue)}.ico.bad{background:var(--badS);color:var(--bad)}
.li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #EEF1F6}.li:last-child{border-bottom:0}
.hr{height:1px;background:var(--bd);margin:18px 0;border:0}
/* shells */
.shell{display:flex;min-height:100vh}
.side{width:250px;background:var(--nav);color:#A5ABC9;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex:none}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--pri),#C026D3);display:inline-flex;align-items:center;justify-content:center;color:#fff}
.side .brand{padding:6px 10px 20px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:500}.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.active{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.side .me{margin-top:auto;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);display:flex;gap:10px;align-items:center;color:#fff}
.mainw{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:66px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:20}
.search{display:flex;align-items:center;gap:10px;background:#F1F4F9;border-radius:10px;padding:9px 14px;width:340px;color:var(--sub)}.search input{border:0;background:none;outline:none;flex:1}
.main{padding:32px;max-width:1280px;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px;flex-wrap:wrap}.ph p{color:var(--sub);margin-top:4px}
.bellb{position:relative;width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--bd)}.bellb i{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--bad);border-radius:50%;border:2px solid #fff}
/* public */
.pnav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.pnav .in2{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.pnav .brand{color:var(--tx)}.links{display:flex;gap:28px;font-weight:500;color:var(--sub)}
.sec{max-width:1180px;margin:0 auto;padding:80px 24px}
.hero{background:radial-gradient(900px 400px at 80% 0,#E9E5FF,transparent),radial-gradient(700px 400px at 0 20%,#FCE7F6,transparent),#fff}
.hero h1{font-size:56px;letter-spacing:-.03em;line-height:1.05}
.grad{background:linear-gradient(135deg,var(--pri),#C026D3);-webkit-background-clip:text;background-clip:text;color:transparent}
.mock{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:0 30px 60px rgba(60,40,160,.15)}
.step{position:relative}.step .num{width:36px;height:36px;border-radius:50%;background:var(--priS);color:var(--pri);font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.foot{background:var(--nav);color:#A5ABC9}.foot .in2{max-width:1180px;margin:0 auto;padding:48px 24px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}.foot h4{color:#fff;margin-bottom:10px;font-size:14px}.foot p{margin-bottom:6px}
/* auth */
.auth{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.authL{background:linear-gradient(150deg,#2A1B8F,#7C3AED 60%,#C026D3);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.authL .brand{color:#fff}.authR{display:flex;align-items:center;justify-content:center;padding:40px;background:#fff}
.authBox{width:100%;max-width:420px}.authBox h1{font-size:30px;margin-bottom:6px}
.sep{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:13px;margin:18px 0}.sep::before,.sep::after{content:"";height:1px;background:var(--bd);flex:1}
.rolec{border:2px solid var(--bd);border-radius:12px;padding:14px;flex:1;text-align:left;background:#fff}.rolec.sel{border-color:var(--pri);background:var(--priS)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:radial-gradient(800px 400px at 50% 0,#E9E5FF,transparent),var(--bg)}
/* roadmap */
.tl{position:relative;padding-left:0}
.sect{display:flex;gap:18px;padding:20px;border:1px solid var(--bd);border-radius:14px;background:#fff;margin-bottom:14px}
.sect.current{border-color:var(--pri);box-shadow:0 0 0 4px rgba(91,78,240,.1)}.sect.locked{background:#F8FAFC;opacity:.8}
.dot{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;background:#EEF1F6;color:var(--sub)}
.sect.passed .dot{background:var(--okS);color:var(--ok)}.sect.current .dot{background:var(--pri);color:#fff}
.drop{border:2px dashed #B8B2FA;border-radius:16px;background:#FAF9FF;padding:40px;text-align:center}.drop:hover{background:var(--priS)}
.code{background:#0F1226;color:#D7DBF5;border-radius:12px;padding:18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;overflow:auto;white-space:pre}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:2px solid var(--bd);border-radius:12px;background:#fff;font-weight:500;width:100%;text-align:left}
.opt:hover{border-color:#B8B2FA}.opt.sel{border-color:var(--pri);background:var(--priS)}.opt.right{border-color:var(--ok);background:#ECFDF5}.opt.wrong{border-color:var(--bad);background:#FEF2F2}
.opt .lt{width:28px;height:28px;border-radius:50%;background:#EEF1F6;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.opt.sel .lt{background:var(--pri);color:#fff}
.bubble{max-width:75%;padding:12px 16px;border-radius:16px;line-height:1.55}
.bubble.me{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble.ai{background:#fff;border:1px solid var(--bd);border-bottom-left-radius:4px}
.slot{padding:10px;border:1px solid var(--bd);border-radius:10px;text-align:center;font-weight:600;background:#fff}.slot:hover{border-color:var(--pri)}.slot.sel{background:var(--pri);color:#fff;border-color:var(--pri)}
.slot.off{opacity:.4;pointer-events:none;text-decoration:line-through}
.avg{display:grid;grid-template-columns:80px repeat(7,1fr);gap:6px;font-size:12px;align-items:center}
.cell{height:34px;border-radius:8px;background:#EEF1F6;border:1px solid transparent}.cell.on{background:var(--priS);border-color:var(--pri)}.cell:hover{border-color:var(--pri)}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--sub)}
.bars i{display:block;width:100%;max-width:44px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--pri2),var(--pri))}
.unread{width:9px;height:9px;border-radius:50%;background:var(--pri);flex:none}
.modal{position:fixed;inset:0;background:rgba(15,18,38,.55);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}.modal.open{display:flex}
.mbox{background:#fff;border-radius:18px;padding:28px;width:100%;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:#0F1226;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:200;font-weight:500}#toast.show{opacity:1;transform:translate(-50%,0)}
/* prototype index */
#pbtn{position:fixed;left:16px;bottom:16px;z-index:150;background:#0F1226;color:#fff;border-radius:99px;padding:10px 16px;font-weight:600;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center;border:0}
#pidx{position:fixed;left:16px;bottom:64px;width:330px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:14px;z-index:150;display:none}#pidx.open{display:block}
#pidx h5{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin:12px 6px 6px}
#pidx a{display:flex;gap:10px;padding:7px 8px;border-radius:8px;font-size:13px}#pidx a:hover{background:var(--priS)}#pidx a.cur{background:var(--pri);color:#fff}#pidx a b{width:24px;opacity:.6}
@media(max-width:1000px){.side{display:none}.g3,.g4,.g21,.g12{grid-template-columns:1fr 1fr}.auth{grid-template-columns:1fr}.authL{display:none}.hero h1{font-size:38px}.search{display:none}.foot .in2{grid-template-columns:1fr 1fr}.links{display:none}}
@media(max-width:640px){.g2,.g3,.g4,.g21,.g12{grid-template-columns:1fr}.main{padding:18px}.top{padding:0 16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="modals"></div>
<button id="pbtn" data-act="pidx"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span id="plabel">Screens</span></button>
<div id="pidx"></div>

<script>
/* ---------- helpers ---------- */
const P={home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z',upload:'M12 16V4m0 0l-4 4m4-4l4 4M4 20h16',map:'M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z',chart:'M4 20V10m6 10V4m6 16v-7m4 7H2',bot:'M12 3v3M5 8h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zM9 13h.01M15 13h.01',search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',cal:'M7 3v4M17 3v4M4 9h16M5 5h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z',bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',users:'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 14 0M17 3.1a4 4 0 0 1 0 7.8M22 21a7 7 0 0 0-5-6.7',shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',cog:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z',dollar:'M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6',star:'M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.5 5.8 21l1.4-7L2 9.3l7-.8z',check:'M4 12l5 5L20 6',lock:'M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1zM8 11V7a4 4 0 0 1 8 0v4',mail:'M3 6h18v12H3zM3 7l9 7 9-7',arrow:'M5 12h14m-6-6l6 6-6 6',logout:'M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9',file:'M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7zM14 3v4h4',flag:'M5 21V4m0 0h12l-2 4 2 4H5',cpu:'M9 3v2M15 3v2M9 19v2M15 19v2M3 9h2M3 15h2M19 9h2M19 15h2M6 5h12a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM9 9h6v6H9z',clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',plus:'M12 5v14M5 12h14',x:'M6 6l12 12M18 6L6 18',lib:'M4 4h4v16H4zM10 4h4v16h-4zM16 5.5l3.9-1 3 14.5-3.9 1z',spark:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z',left:'M19 12H5m6-6l-6 6 6 6',send:'M22 2L11 13M22 2l-7 20-4-9-9-4z',video:'M3 7h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H3zM16 10l5-3v10l-5-3z',google:''};
const ic=(n,s)=>`<svg class="ic" viewBox="0 0 24 24"${s?` style="width:${s}px;height:${s}px"`:''}><path d="${P[n]||''}"/></svg>`;
const COLS=['#5B4EF0','#0EA5E9','#EC4899','#F59E0B','#10B981','#8B5CF6','#EF4444','#14B8A6'];
const av=(n,s=40)=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%97;return `<span class="av" style="width:${s}px;height:${s}px;background:${COLS[h%COLS.length]};font-size:${Math.round(s*.38)}px">${n.split(' ').map(w=>w[0]).slice(0,2).join('')}</span>`};
const bd=(t,c='gray')=>`<span class="badge b-${c}">${t}</span>`;
const pg=(p,c='')=>`<div class="pg ${c}"><i style="width:${p}%"></i></div>`;
const tog=(on)=>`<span class="tog ${on?'on':''}" data-act="tog"></span>`;

<div class="g21"><div class="col"><div class="card"><h2>1. Stacks (LIFO)</h2><p style="margin-top:10px">A <b>stack</b> is a linear structure where the last element added is the first removed. Think of a pile of plates: you add and remove only at the top.</p><div class="code" style="margin-top:14px">stack = []
stack.append(10)   # push
stack.append(20)
stack.pop()        # -> 20 (last in, first out)</div></div>
<div class="card"><h2>2. Queues (FIFO)</h2><p style="margin-top:10px">A <b>queue</b> removes the oldest element first, like people waiting in line. Elements are added at the rear (<i>enqueue</i>) and removed from the front (<i>dequeue</i>).</p><div class="code" style="margin-top:14px">from collections import deque
q = deque()
q.append("A"); q.append("B")
q.popleft()        # -> "A" (first in, first out)</div></div>
<div class="card"><h2>Key takeaways</h2><ul style="margin:10px 0 0 18px;line-height:1.9"><li>Stack = LIFO · Queue = FIFO</li><li>Push/pop and enqueue/dequeue are O(1)</li><li>Stacks power undo and recursion; queues power BFS and scheduling</li></ul></div></div>

  transcript:()=>{$('#tr').innerHTML=`${ic('check')} transcript_elif_demir.pdf uploaded`},
  startq:()=>{state.qi=0;state.ans=[];go('11')},
  qpick:e=>{state.ans[state.qi]=+e.dataset.i;const y=scrollY;render();scrollTo(0,y)},
  qprev:()=>{state.qi--;render()},
  qnext:()=>{if(state.qi<QZ.length-1){state.qi++;render()}else{state.last=[...state.ans];const sc=state.last.filter((x,i)=>x===QZ[i].a).length;state.score=Math.round(sc/QZ.length*100);state.s3=state.score>=75;go('12')}},
  continue:()=>go('09'),
  send:()=>{const i=$('#chatin');const v=i.value.trim();if(!v)return;const c=$('#chat');c.insertAdjacentHTML('beforeend',`<div class="bubble me">${v.replace(/</g,'&lt;')}</div>`);i.value='';c.scrollTop=c.scrollHeight;setTimeout(()=>{c.insertAdjacentHTML('beforeend',`<div class="bubble ai">${chatReply(v)}</div>`);c.scrollTop=c.scrollHeight},600)},
  prompt:e=>{$('#chatin').value=e.textContent;actions.send()},
  tutor:e=>{state.tutor=+e.dataset.i;go('16')},
  readall:()=>{$$('.unread').forEach(x=>x.remove());toast('All notifications marked as read')},
  decide:e=>{const r=e.closest('[data-row]');r.querySelector('[data-st]').innerHTML=e.dataset.v==='ok'?bd('Accepted','ok'):bd('Declined','bad');r.querySelector('[data-btns]').remove();toast(e.dataset.v==='ok'?'Session accepted':'Request declined')},
  pickapp:e=>{$$('[data-act="pickapp"]').forEach(x=>x.style.background='');e.style.background='var(--priS)';$('#appn').textContent=e.querySelector('.b').textContent;$('#appst').innerHTML=bd('Pending','warn');$('#rejbox').classList.add('hide')},
  approve:()=>{$('#appst').innerHTML=bd('Approved','ok');toast('Tutor approved — notification sent')},
  reject:()=>{const b=$('#rejbox');if(b.classList.contains('hide')){b.classList.remove('hide');toast('Add a reason, then click Reject again')}else{$('#appst').innerHTML=bd('Rejected','bad');toast('Application rejected')}},
  mod:e=>{const r=e.closest('[data-row]');r.querySelector('[data-st]').innerHTML=bd(e.dataset.v,e.dataset.v==='Dismissed'?'gray':'ok');const t=r.querySelector('h3').textContent;const l=$('#modlog');if(l.textContent.startsWith('No'))l.innerHTML='';l.insertAdjacentHTML('beforeend',`<div class="li"><span class="grow"><b>${t}</b> — ${e.dataset.v}</span><span class="xs">just now</span></div>`);r.querySelector('[data-btns]').remove();toast('Decision recorded')}
};
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.matches('.modal'))t.classList.remove('open');
  const m=t.closest('[data-modal]');if(m){$('#'+m.dataset.modal).classList.add('open');return}
  const a=t.closest('[data-act]');if(a&&!a.disabled){actions[a.dataset.act]?.(a,e);if(!a.dataset.go&&!a.dataset.toast)return}
  const tt=t.closest('[data-toast]');if(tt)toast(tt.dataset.toast);
  if(t.closest('[data-close]'))t.closest('.modal')?.classList.remove('open');
  const g=t.closest('[data-go]');if(g&&!(a&&a.dataset.act&&!a.dataset.go)){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'));go(g.dataset.go)}
});
addEventListener('hashchange',render);
render();
</script>
</body>
</html>
